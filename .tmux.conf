# Environment Variables for Tmux
set-environment -g DBUS_SESSION_BUS_ADDRESS "unix:path=/run/user/1000/bus"
set-environment -g XDG_RUNTIME_DIR "/run/user/1000"

# General Settings
set -g default-terminal "tmux-256color"
set -g default-shell /usr/bin/zsh
set -g history-limit 10000
set -sg escape-time 10
set -g detach-on-destroy off  # Don't exit tmux when closing a session
set -g focus-events on
set -gq allow-passthrough all
setw -g mode-keys vi
set -g remain-on-exit off
set-hook -g pane-exited 'run-shell -b "/home/decoder/dev/dotfiles/scripts/__codex_app_server_gc.sh >/dev/null 2>>/home/decoder/.codex/logs/app-server-gc.log"'

# Activity and Events
set -g monitor-activity on
set -g visual-activity off

# Status Line Configuration
set -g status-position bottom 
set -g status-left-length 60
set -g status-justify absolute-centre
set -g status-interval 60 

# Dracula Theme and Plugins
set -g @plugin 'dracula/tmux'
set -g @dracula-plugins "custom:task"
set -g @dracula-show-left-icon session
set -g @dracula-show-powerline true
set -g @dracula-military-time true
set -g @dracula-border-contrast true
set -g @dracula-show-flags true
# Custom task plugin colors (cyan and dark_gray)
set -g @dracula-custom-plugin-colors "cyan dark_gray"
set -g @plugin 'laktak/extrakto'
set -g @extrakto_filter_order "line all word quote"
bind -n M-y run-shell "~/.tmux/plugins/extrakto/scripts/open.sh '#{pane_id}'"


# Truecolor and terminal features for Alacritty
set -ga terminal-overrides ',xterm-256color:Tc'
set -as terminal-features ',xterm-256color:RGB:usstyle:extkeys:sync'
set -as terminal-features ',tmux-256color:RGB:usstyle:extkeys:sync'

# Window and Pane Behavior
set -g base-index 1
set -g pane-base-index 1
set -g pane-border-style "fg=magenta"
set -g pane-active-border-style "fg=green,bg=default"
set -g display-panes-time 100000  # 100 seconds
set -g pane-border-status top
set -g pane-border-format " #{?#{||:#{==:#T,#{host}},#{m:*tmux*,#T}},#{pane_current_command} #{b:pane_current_path},#T}#{?@agent_name, [AGENT: #{@agent_name}],}#{?@kctx_display, [KCTX: #{@kctx_display}],#{?@kctx_context, [KCTX: #{@kctx_context}],}} "

# Key Bindings - Window and Pane Management
bind-key -n F2 new-window 
bind-key -n 'M-m' run-shell "$HOME/dev/dotfiles/scripts/__tmux_toggle_reading_margin.sh '#{pane_id}'"
bind-key -n F5 split-window -h -c "#{pane_current_path}"
bind-key -n F6 split-window -v -c "#{pane_current_path}"
bind-key -n F8 command-prompt -I "#W" "rename-window '%%'"
bind-key -n F7 command-prompt "find-window '%%'"
bind-key -n F10 setw synchronize-panes
bind-key -n F11 resize-pane -Z
bind-key -n F12 kill-pane
bind-key -n C-PageDown next-window
bind-key -n C-PageUp previous-window
bind-key -n M-S-Left resize-pane -L
bind-key -n M-S-Right resize-pane -R
bind-key -n M-S-Up resize-pane -U
bind-key -n M-S-Down resize-pane -D
bind-key -n M-PageUp run-shell "$HOME/dev/dotfiles/scripts/__cycle_tmux_session.sh prev"
bind-key -n M-PageDown run-shell "$HOME/dev/dotfiles/scripts/__cycle_tmux_session.sh next"
bind -n M-\; copy-mode
bind -n M-/ copy-mode \; command-prompt -i -p "(search up) " "send-keys -X search-backward-incremental \"%%\""
bind-key w select-window -t 1
bind -n M-s switch-client -l

# Key Bindings - Pane Detach/Attach
bind-key ! break-pane -d -n _hidden_pane
bind-key S run-shell "$HOME/dev/dotfiles/scripts/__tmux_pane_to_session.sh '#{pane_id}'"
bind-key @ join-pane -s $.1
bind-key H choose-window 'join-pane -v -s "%%"'
bind-key V choose-window 'join-pane -h -s "%%"'

# Clipboard Integration
set -g set-clipboard on
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "perl -pe 'chomp if eof' | xclip -in -selection clipboard"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "perl -pe 'chomp if eof' | xclip -in -selection clipboard"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "perl -pe 'chomp if eof' | xclip -in -selection clipboard"
# Open pane content in nvim for text-object yanking (yip, yiw, etc)
bind -n M-Y run-shell "tmux capture-pane -p -S -3000 > /tmp/tmux-yank-buffer" \; display-popup -E -h 90% -w 90% "nvim -c 'setlocal buftype=nofile bufhidden=wipe filetype=markdown' -c 'nnoremap <buffer> q :q!<CR>' -c 'normal G' /tmp/tmux-yank-buffer"
# Claude session output — resolves current pane's session via broadcast files
bind -n M-o run-shell "~/.claude/scripts/__claude_open_output.sh '#{pane_id}'"

# Copy mode search highlighting (tmux 3.4+)
set -g copy-mode-match-style "bg=magenta,fg=black"
set -g copy-mode-current-match-style "bg=yellow,fg=black,bold"
# Incremental search so matches highlight live as you type (neovim incsearch/hlsearch feel)
bind-key -T copy-mode-vi / command-prompt -i -p "(search down) " "send-keys -X search-forward-incremental \"%%\""
bind-key -T copy-mode-vi ? command-prompt -i -p "(search up) " "send-keys -X search-backward-incremental \"%%\""

# --- Options newer than tmux 3.4 -----------------------------------------
# Each guard reads #{version}, the SERVER version, NOT `tmux -V`. Since
# /usr/local/bin/tmux is 3.7b while /usr/bin/tmux is still the 3.4 package, a
# subshell calling `tmux -V` reports whichever CLIENT is first on PATH, which
# is not necessarily the server loading this file. #{version} is expanded by
# the server itself, so it is always right. Setting an unknown option aborts
# the rest of the config, hence the guards rather than bare set lines.

# 3.5: stop programs hijacking the pane title via escape sequence. The
# pane-border-format above works around exactly this. `select-pane -T` is a
# tmux command and is unaffected, so titles you set yourself still show.
if-shell -b '[ "$(printf %s "#{version}" | sed -E "s/^([0-9]+)\.([0-9]+).*/\1\2/")" -ge 35 ]' \
    'setw -g allow-set-title off'

# 3.6: the two siblings of copy-mode-match-style set above.
if-shell -b '[ "$(printf %s "#{version}" | sed -E "s/^([0-9]+)\.([0-9]+).*/\1\2/")" -ge 36 ]' \
    'set -g copy-mode-selection-style "bg=#44475a,fg=#f8f8f2" ; set -g copy-mode-position-style "bg=#bd93f9,fg=#282a36"'

# 3.7: nvim-style line numbers in copy mode (current line absolute, rest
# relative), completing the incsearch/hlsearch feel of the bindings above.
# The [3/17] match counter needs no config: 3.7's default
# copy-mode-position-format already includes #{search_count}.
if-shell -b '[ "$(printf %s "#{version}" | sed -E "s/^([0-9]+)\.([0-9]+).*/\1\2/")" -ge 37 ]' \
    'set -g copy-mode-line-numbers hybrid ; set -g copy-mode-line-number-style "fg=#6272a4" ; set -g copy-mode-current-line-number-style "fg=#f1fa8c,bold"'

# Key Bindings - Vim-Tmux Navigation
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
# C-\ jumps to the last pane. This used to sit behind a version guard that read
# a `tmux_version="..."` shell assignment, which tmux never actually sets, so
# $tmux_version was empty inside the if-shell and NEITHER branch ever fired:
# C-\ was silently unbound while C-h/j/k/l worked. Both 3.4 and 3.7 are >= 3.0,
# so the guard bought nothing and the binding is now made directly.
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\'  'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Key Bindings - Utilities and Scripts
bind h run-shell "/home/decoder/dev/dotfiles/scripts/__tmux_toggle_borders.sh"
bind r source-file ~/.tmux.conf \; display "Tmux Reloaded"
# Open Linear issue / GitHub PR for the current agent session, standalone.
# M-a: Linear issue parsed from the session name (e.g. ai-agents-ENGAI-110 -> ENGAI-110)
# M-p: GitHub PR for the current pane's branch
bind-key -n M-a run-shell -b "~/dev/dotfiles/scripts/__open_pane_linear.sh '#{session_name}'"
bind-key -n M-p run-shell -b "~/dev/dotfiles/scripts/__open_pane_pr.sh '#{pane_current_path}'"
bind -n M-r run-shell "~/dev/dotfiles/scripts/__trigger_yazi.sh"
bind -n C-M-r run-shell "~/dev/dotfiles/scripts/__respawn_task_panes.sh"
bind C-t popup -E -h 75% -w 83% -x 100% "python3 /home/decoder/dev/dotfiles/scripts/__hooks_parser.py /home/decoder/dev/dotfiles/.task/hooks/on-modify-openurl-or-program.py | bat -l md --style=plain --paging=always"
bind -n M-z popup -d '#{pane_current_path}' -E -h 75% -w 83% -x 100% "zsh"
bind -n M-b popup -d '#{pane_current_path}' -E -h 95% -w 95% -x 100% "btop"
bind -n M-l popup -d '#{pane_current_path}' -E -h 95% -w 95% "EDITOR=nvim lazygit"

# Key Bindings - Universal File/Session Opener
bind -n M-x display-popup -E -h 75% -w 75% "~/dev/dotfiles/scripts/__file_opener.sh"
bind -n M-i set-option -gF @fabric_prompt_target "#{pane_id}" \; display-popup -EE -h 80% -w 90% "~/dev/dotfiles/scripts/__orchestrator.sh"

# Key Bindings - Claude-wt Global Worktree Switcher (centralized)
bind -n M-w display-popup -E -h 80% -w 90% "claude-wt switch"

# Key Bindings - Tmux Session Control
bind -n M-e display-popup -E "~/dev/dotfiles/scripts/__kill_tmux_session.sh"
bind -n M-G run-shell "~/dev/dotfiles/scripts/__git_monitor_switch_only.sh"
bind -n M-g display-popup -E -w 90% -h 85% -b rounded -T " search " -S "fg=colour45" "~/dev/dotfiles/scripts/__ddgx.sh"
bind -n M-k display-popup -E -h 75% -w 75% "~/.claude/scripts/__claude_launcher.sh"
bind -n M-K display-popup -E -d '#{pane_current_path}' -h 75% -w 75% -T " Codex " "~/dev/dotfiles/scripts/__codex_launcher.sh"
unbind k

# Initialize TMUX Plugin Manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Those settings must stay last so that dracula theme parts are overriden
left_sep=''
right_sep=''
light_purple='#bd93f9'

# Status Line Formats
set -g window-status-format "#[fg=#44475a]${left_sep}#[default] #{?pane_synchronized,💢 ,} #{window_name} #{?window_zoomed_flag,👀 ,} #[fg=#44475a]${right_sep}#[default]"
set -g window-status-current-format "#[fg=#44475a,bg=colour105]${left_sep}#[fg=black,bg=colour105] #{window_name} #{?window_zoomed_flag,👀 ,}#{?pane_synchronized,💢 ,}#[fg=#44475a,bg=colour105]${right_sep}#[default]"
setw -g window-active-style 'bg=#000000'
setw -g window-style 'bg=#1a1a1a'

# tmux 3.7 rewrote message drawing: a message now covers only as much of the
# status line as message-style's fill= says, instead of replacing the whole
# line. Dracula sets message-style without fill=, so prompts and messages
# render truncated on 3.7. Upstream dracula fixed this after the v3.3.1 tag,
# so we set it here rather than depending on the plugin. tmux 3.4 parses
# fill= happily and ignores it, so this one line is correct on both.
set -g message-style "bg=#44475a,fg=#f8f8f2,fill=#44475a"
set-hook -g session-created 'run-shell -b "sleep 1; $HOME/dev/dotfiles/scripts/__tmux_toggle_reading_margin.sh --ensure-session \"#{hook_session_name}\""'
set-hook -g session-closed 'run-shell "~/.claude/scripts/__tmux_session_cleanup.sh \"#{hook_session_name}\""'
set-hook -g client-session-changed 'run-shell "~/dev/dotfiles/scripts/__tmux_active_task.sh --update; tmux refresh-client -S"'
