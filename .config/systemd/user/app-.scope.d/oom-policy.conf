# Every GNOME-launched app scope (app-gnome-*, app-com.google.Chrome-*, the
# __boot.sh scope) inherits DefaultOOMPolicy=stop, so one OOM-killed process
# tears down everything sharing its scope. On 2026-10-13 a runaway task
# process in a tmux pane took the tmux server, every worker and Chrome with it.
# continue keeps the scope alive and loses only the killed process.
[Scope]
OOMPolicy=continue
