audio-buffer=0.5
# Cookies are off, and this is why. An authenticated request to YouTube from
# this machine comes back with a format list holding nothing but images, so
# every video died with "Requested format is not available", which reads like a
# broken format selector rather than a cookie problem. The same request without
# cookies returns every format and plays.
#
# The obvious suspect was the missing JS runtime, since yt-dlp warns about one
# on every call. It is not that: deno 2.9.5 is installed at ~/.deno/bin and
# tested both ways, and authenticated extraction still returns only images
# while anonymous extraction works. So this is the account or the session being
# refused, not a token this machine failed to compute. Turning the line back on
# needs that understood first; it is not waiting on a dependency.
#
# Cost of leaving it off: age-restricted, private and members-only videos.
#
# The path also has to be absolute if it comes back: mpv hands the value to
# yt-dlp verbatim and yt-dlp does not expand ~.
# ytdl-raw-options=cookies-from-browser=firefox:/home/decoder/.var/app/io.gitlab.librewolf-community/.librewolf/7fs4462i.decoder

# --- bonus mpv tips ---

# Native resolution, 4K where it exists.
#
# The old chain asked for vcodec^=avc1 at height=1080, which cannot ever give
# 4K: YouTube publishes 2160p as VP9 and AV1 only, never as H.264. It was also
# capped at 1080 twice over. Both GPUs here decode VP9 and AV1 in hardware
# (Intel Arrow Lake iGPU, NVIDIA Blackwell), so there is no reason to pin a
# codec at all; asking for the best video stream and letting hwdec sort it out
# is what gets the native picture.
#
# 2160 rather than unbounded, because 4K is the point at which more pixels stop
# being visible on this machine's panels and start being bandwidth.
#
# No quotes. mpv takes everything after the = as the value, quote characters
# included, so the previously quoted form handed yt-dlp a selector that began
# with a " and matched no format at all. Every YouTube url then died with
# "Requested format is not available", which reads like a YouTube or yt-dlp
# fault and sends you looking in the wrong place. The trailing /best could not
# rescue it either: the whole chain was one unparseable token rather than a
# list of alternatives.
ytdl-format=bestvideo[height<=?2160]+bestaudio/bestvideo+bestaudio/best

# defines where screenshots will be saved
screenshot-directory=~/Pictures/mpv_screenshots/

# enable hardware accelaration
hwdec=auto
vo=gpu

# MPV Monitor IPC Configuration
input-ipc-server=/tmp/mpvsocket
