# Config-driven parser definitions for bindings help
# Each section defines how to extract bindings from a config file

base_dirs = ["~/dev/dotfiles"]
query_engines = ["nvim", "tmuxinator"]  # Enable runtime query engines

[tmux]
paths = [".tmux.conf"]
# -T is a flag to bind itself (the key table), so it only counts before the key.
# Matching it anywhere silently dropped every display-popup that sets a title
# with -T, M-g among them. (?!\S) forces the -key token to be consumed whole so
# the engine cannot backtrack past it and skip this check.
match_line = '^bind(?:-key)?(?!\S)(?!(?:\s+-[a-zA-Z]+)*\s+-T\b)'
regex = 'bind(?:-key)?\s+(?:-n\s+)?(\S+)(.*)'
key_group = 1
desc_group = 2
type = "tmux"

[tmux-copy]
paths = [".tmux.conf"]
# Anchored for the same reason: a popup title mentioning copy-mode is not a
# key-table binding.
match_line = '^bind(?:-key)?(?!\S)(?:\s+-[a-zA-Z]+)*\s+-T\s+copy-mode'
regex = 'bind(?:-key)?\s+-T\s+\S+\s+(\S+)(.*)'
key_group = 1
desc_group = 2
type = "tmux-copy"

[zsh-bindkey]
paths = [".zshrc"]
match_line = "bindkey"
skip_comment = true
regex = "bindkey\\s+(?:-s\\s+)?['\"]([^'\"]+)['\"]"
key_group = 1
# desc from trailing comment or function name
desc_from_comment = true
type = "zsh"

[alias]
paths = [".zsh_aliases", ".zsh_claude"]
regex = "alias\\s+(?:-[gs]\\s+)?([^=]+)=(.*)"
key_group = 1
desc_group = 2
type = "alias"
strip_quotes = true

[abbrev]
paths = [".zsh_abbreviations"]
match_line = '".*"'
regex = '''"([^"]+)"\s+'([^']+)''''
key_group = 1
desc_group = 2
type = "abbr"

[function]
paths = [".zsh_functions"]
regex = '(?:function\s+)?(\w+)\s*\(\)\s*\{?'
skip_comment = true
key_group = 1
desc_literal = "(function)"
type = "func"

[engine.nvim]

[bookmarks]
paths = ["scripts/__bookmarks.conf"]
regex = '^([^;]+);(.+)$'
key_group = 1
desc_group = 2
type = "bookmark"
open_target = true  # --edit opens the path (desc) instead of source file

[autokey]
paths = ["scripts/__autokey_bindings.conf"]
regex = '^([^|]+)\|(.+)$'
key_group = 1
desc_group = 2
type = "autokey"

[zsh-jumper]
paths = ["~/.config/zsh-jumper/config.toml"]
match_line = "^binding"
regex = "binding\\s*=\\s*['\"]([^'\"]+)['\"]"
key_group = 1
desc_literal = "(zsh-jumper fzf action)"
type = "zj"

[zledit-actions]
parser = "toml"
paths = ["~/.config/zledit/config.toml"]
binding_path = "actions"
key = "binding"
desc = "description"
type = "zledit"

[zledit-previewers]
parser = "toml"
paths = ["~/.config/zledit/config.toml"]
binding_path = "previewers"
key = "description"
desc = "script"
type = "zledit-prev"

[taskwarrior-tui]
paths = [".taskrc"]
match_line = "uda.taskwarrior-tui.shortcuts"
regex = 'uda\.taskwarrior-tui\.shortcuts\.(\d+)=(.+)'
key_group = 1
desc_group = 2
type = "task-tui"

[claude-prefix]
parser = "toml"
paths = ["~/.claude/file-suggestion.toml"]
binding_path = "prefixes"
key = "name"
desc = "description"
type = "claude-@"

# Claude Code TUI keybindings. The file nests them as bindings[].bindings, a
# dict of key -> action rather than a list of records, which the structured
# parser cannot walk, so match the action lines directly. The value pattern
# (word:word) is what separates a real binding from "$schema": "https://..."
# and "context": "Global"; a null action (space) is unquoted and skipped.
[claude]
paths = ["~/.claude/keybindings.json"]
match_line = '"[^"]+"\s*:\s*"[a-zA-Z]+:[a-zA-Z]+"'
regex = '"([^"]+)"\s*:\s*"([^"]+)"'
key_group = 1
desc_group = 2
type = "claude"

# Alacritty key bindings. An entry carries either an action or a chars escape
# sequence, never both, so desc combines the two and takes whichever is set.
[alacritty-key]
parser = "toml"
paths = [".config/alacritty/alacritty.toml"]
binding_path = "keyboard.bindings"
key = "mods+key"
desc = "action+chars"
type = "alacritty"
