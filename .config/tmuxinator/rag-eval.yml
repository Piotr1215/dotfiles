name: rag-eval
root: ~/.claude
startup_window: evaluation

# Dedicated session for the session-evaluation harness. This intentionally does
# not join rag-monitor: injection health and experiment health have different
# failure domains, refresh rates, and operator actions.
#
# main-vertical keeps the variable-height cockpit full-height on the left and
# stacks the two streaming/detail panes on the right.
#
#   +----------------------------+-------------------------+
#   | alarms, corpus health,     | judgment corpus tail    |
#   | knob rollups + trends,     |                         |
#   | run overview               +-------------------------+
#   |                            | active-run stage detail |
#   +----------------------------+-------------------------+

windows:
  - evaluation:
      layout: main-vertical
      panes:
        # Alarms are rendered first so additional runs and knob trends grow
        # below them without pushing failures off-screen.
        - |
          tmux set-window-option main-pane-width 112 >/dev/null 2>&1
          tmux select-layout main-vertical >/dev/null 2>&1
          watch -ct -n 5 '$HOME/.claude/scripts/__rag_eval_dashboard.sh cockpit'

        # Preference-data feed. tail -F survives corpus replacement/rotation;
        # fromjson? discards one malformed record instead of terminating jq.
        - |
          state_dir="$HOME/.local/state/claude-rag-eval"
          mkdir -p "$state_dir"
          touch "$state_dir/judgments.jsonl"
          clear && echo "waiting for judgment corpus rows..." && \
          tail -F -n 24 "$state_dir/judgments.jsonl" 2>/dev/null \
            | jq -Rrc --unbuffered 'fromjson? |
                "\((.ts//\"\")[11:19])  " +
                "\((.comparison_type//\"ab\")|ascii_upcase)  " +
                "\((.winner//\"error\")|ascii_upcase)  " +
                "margin=\(.margin//0)  attributed=\((.attributed_to_context//.attributed_to_change//false))  " +
                "\(.knob_id//\"-\")  ep=\((.episode_id//\"?\")|split(\":\")[-1])  " +
                (if .parse_ok == false then "PARSE_FAIL" else "" end)'

        # Resolves the active run on every refresh, so runs launched from other
        # sessions appear without restarting this cockpit.
        - |
          watch -ct -n 3 '$HOME/.claude/scripts/__rag_eval_dashboard.sh active'
