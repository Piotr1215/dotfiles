name: rag-monitor
root: ~/.claude

# Observability for the context-injection layer: which hooks fired, what they
# retrieved, and what quietly did nothing.
#
# Why this session exists: a PreToolUse hook that never fires emits no output and
# no error, so a broken matcher is invisible from inside a Claude session. Two of
# them hid for weeks. `Read` was dropped from __memory_enrich_hook.sh's matcher on
# 2026-07-11 (aa883fe), so reading a file surfaced no memories at all. Separately
# the matcher entry `Task` stopped matching when the subagent tool was renamed to
# `Agent`, and being a regex it then matched the TaskCreate/TaskUpdate bookkeeping
# tools instead of the actual spawn. Both were found only because a human noticed
# the behaviour was missing. The fix is to record the NEGATIVE events (miss, dedup,
# skip, timeout) next to the hits, so a gap shows up as a zero in a coverage
# matrix instead of as nothing at all.
#
# Event log:  ~/.local/state/claude-injections.jsonl   (written by __inject_log.sh)
# Renderer:   ~/.claude/scripts/__inject_dashboard.sh  (read-only, one-shot)
#
# Layout: main-vertical puts pane 1 full-height on the left and stacks the rest on
# the right. Aggregate view needs the height (matrix plus freshness table); the two
# feeds are single lines each and read fine in a short pane.
#
#   +----------------------+------------------+
#   |                      |  injection       |
#   |   injection          |  events (tail)   |
#   |   dashboard          +------------------+
#   |   (aggregate)        |  backend         |
#   |                      |  latency watch   |
#   +----------------------+------------------+

windows:
  - injections:
      layout: main-vertical
      panes:
        # Aggregate view: per-hook hit/miss/dedup/error rates, the tool x hook
        # coverage matrix, per-repo index freshness, and active alarms.
        - watch -ct -n 5 '$HOME/.claude/scripts/__inject_dashboard.sh --hours 24'
        # Live feed. Every hook decision as it happens, newest at the bottom.
        # --unbuffered so lines appear on write instead of at the next 4KB flush.
        # tail -F (not -f) so log trimming, which replaces the file, does not end
        # the feed.
        - |
          clear && echo "waiting for the first injection event..." && \
          tail -F -n 30 "$HOME/.local/state/claude-injections.jsonl" 2>/dev/null \
            | jq -rc --unbuffered '
                "\((.ts//"")[11:19])  \(.status|ascii_upcase)  " +
                "\(.hook)\(if (.channel//"") != "" then "/" + .channel else "" end)  " +
                "\(.tool//"-")  n=\(.n//0)  \((.subject//"")[0:36])  \(.note//"")"'
        # Are the two retrieval backends answering, and how fast? A hook that
        # times out logs `timeout`, but that cannot tell you whether the backend
        # is down or merely slower than the 0.4s/1.0s budgets allow.
        - |
          watch -t -n 30 '
            printf "memory-api  "
            curl -s -o /dev/null -w "%{http_code}  %{time_total}s\n" \
              -X POST https://agent-memory.tail165ec.ts.net/v1/long-term-memory/search \
              -H "Content-Type: application/json" \
              -d "{\"text\":\"ping\",\"limit\":1}" --max-time 5
            printf "r2r         "
            curl -sk -o /dev/null -w "%{http_code}  %{time_total}s\n" \
              -X POST https://r2r.tail165ec.ts.net/v3/retrieval/search \
              -H "Content-Type: application/json" \
              -d "{\"query\":\"ping\",\"search_settings\":{\"limit\":1}}" --max-time 5
          '
