# /home/decoder/.config/tmuxinator/atosik.yml

name: task
root: ~/loft/

# Optional tmux socket
# socket_name: foo

# Note that the pre and post options have been deprecated and will be replaced by
# project hooks.

# Project hooks

# Runs on project start, always
# on_project_start: for p in $(pgrep -x claude); do ps -p $p -o args= | grep -q triage-agent-system-prompt && kill -9 $p; done 2>/dev/null; task context work && tmux set-option -g status-interval 1

# Run on project start, the first time
# This is no longer needed as the systemd service handles this now.
# on_project_first_start: zsh -c 'direnv exec . ~/dev/dotfiles/scripts/__github_issue_sync.sh'

# Run on project start, after the first time
# on_project_restart: command

# Run on project exit ( detaching from tmux session )
# on_project_exit: command

# Run on project stop
# on_project_stop: pkill gnome-pomodoro

# Runs in each window and pane before window/pane specific commands. Useful for setting up interpreter versions.
# pre_window: tmux source-file ~/.tmux.conf 

# Pass command line options to tmux. Useful for specifying a different tmux.conf.
# tmux_options: -f ~/.tmux.mac.conf

# Change the command to call tmux.  This can be used by derivatives/wrappers like byobu.
# tmux_command: byobu

# Specifies (by name or index) which window will be selected on project startup. If not set, the first window is used.
# startup_window: vim

# Specifies (by index) which pane of the specified window will be selected on project startup. If not set, the first pane is used.
startup_pane: 3

# Controls whether the tmux session should be attached to automatically. Defaults to true.
# attach: false

windows:
  - todo:
      layout: '{"V":2,"L":{"t":"h","w":255,"h":61,"x":0,"y":0,"c":[{"t":"p","w":74,"h":61,"x":0,"y":0,"l":1,"i":1,"I":"%1"},{"t":"v","w":180,"h":61,"x":75,"y":0,"c":[{"t":"p","w":180,"h":26,"x":75,"y":0,"a":true,"i":2,"I":"%4"},{"t":"p","w":180,"h":34,"x":75,"y":27,"l":0,"i":3,"I":"%5"}]}]}}'
      # Add stty to force terminal redraw on focus
      panes:
        # The work margin (Focus, then the cockpit) as a fixed pane. This window
        # is in @reading_margin_skip_windows, so it gets no automatic overlay.
        - ~/dev/dotfiles/scripts/__tmux_reading_margin_work.sh task "$(tmux display-message -p -t "$TMUX_PANE" '#{window_id}')"
        - tuiw
        # Gordon sits under the current report, in the pane the PR review
        # report used to hold.
        # The small system prompt holds Gordon's values and authority boundary.
        # The gordon plugin loads operating context progressively. Its
        # SessionStart hook writes a recovery file holding his operating skill on
        # every start, resume, clear and compaction, and a gate makes him read it.
        # ~/loft/gordon selects the WORK account; the shared skills overlay makes
        # the local gordon@skills-dir plugin available there.
        # The model is the `gordon` role in ~/.claude/models.env, read at launch.
        # The same gate makes him load model-router, which governs every
        # delegation; without it Gordon spawned general-purpose by default. The
        # first prompt only starts the turn: a /gordon:gordon here loaded his
        # skill a second time beside the recovery file (7 Nov census).
        # PR_WATCH_SCOPE=ai: pr-watch polls the PRs the transcript mentions and
        # Gordon picks the band rows, so Piotr sees the PRs agents work on.
        # GORDON_PINS_SCOPE=ai: Gordon keeps up to 3 pins of its own beside his.
        - cd "$HOME/loft/gordon" && MCP_TIMEOUT=120000 PR_WATCH_SCOPE=ai GORDON_PINS_SCOPE=ai __claude_with_monitor.sh --system-prompt-file ~/.claude/system-prompts/triage-agent-system-prompt.md --model "$(~/.claude/scripts/__models.sh get gordon)" -- "Start your shift. Do the mandatory recovery your session start names, then keep going."
  # Kendra is a function, not a session (Piotr1215/claude#230): kendra-fn.timer
  # judges everything sent to the bus name intake every 5 minutes in one fresh
  # headless call per batch and applies the verdicts with scripts. This pane
  # only watches her: mode, presence, next run, events, cost, and the latest
  # verdicts. The old session launcher, __intake_launch.sh, is kept for rollback.
  - kendra:
      layout: '{"V":2,"L":{"t":"v","w":255,"h":61,"x":0,"y":0,"c":[{"t":"p","w":255,"h":41,"x":0,"y":0,"l":0,"i":1,"I":"%2"},{"t":"p","w":255,"h":19,"x":0,"y":42,"a":true,"i":2,"I":"%23"}]}}'
      panes:
        - viddy -n 10s -t '~/.claude/scripts/__kendra_fn.py status --rows 34'
        - NCURSES_NO_UTF8_ACS=1 tui -r backlog
