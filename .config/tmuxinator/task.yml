# /home/decoder/.config/tmuxinator/atosik.yml

name: task
root: ~/loft/

# Optional tmux socket
# socket_name: foo

# Note that the pre and post options have been deprecated and will be replaced by
# project hooks.

# Project hooks

# Runs on project start, always
# on_project_start: for p in $(pgrep -x claude); do ps -p $p -o args= | grep -q triage-agent-system-prompt && kill -9 $p; done 2>/dev/null; task context work && tmux set-option -g status-interval 1

# Run on project start, the first time
# This is no longer needed as the systemd service handles this now.
# on_project_first_start: zsh -c 'direnv exec . ~/dev/dotfiles/scripts/__github_issue_sync.sh'

# Run on project start, after the first time
# on_project_restart: command

# Run on project exit ( detaching from tmux session )
# on_project_exit: command

# Run on project stop
# on_project_stop: pkill gnome-pomodoro

# Runs in each window and pane before window/pane specific commands. Useful for setting up interpreter versions.
# pre_window: tmux source-file ~/.tmux.conf 

# Pass command line options to tmux. Useful for specifying a different tmux.conf.
# tmux_options: -f ~/.tmux.mac.conf

# Change the command to call tmux.  This can be used by derivatives/wrappers like byobu.
# tmux_command: byobu

# Specifies (by name or index) which window will be selected on project startup. If not set, the first window is used.
# startup_window: vim

# Specifies (by index) which pane of the specified window will be selected on project startup. If not set, the first pane is used.
startup_pane: 3

# Controls whether the tmux session should be attached to automatically. Defaults to true.
# attach: false

windows:
  - todo:
      layout: dcc2,294x72,0,0{82x72,0,0[82x42,0,0,9,82x29,0,43,10],211x72,83,0[211x42,83,0,11,211x29,83,43,12]}
      # Add stty to force terminal redraw on focus
      panes:
        - NCURSES_NO_UTF8_ACS=1 tui -r workdone
        - NCURSES_NO_UTF8_ACS=1 tui -r backlog
        - tuiw
        - NCURSES_NO_UTF8_ACS=1 tui -r current-prs-age
  - private:
      layout: 72be,150x72,0,0[150x42,0,0,4,150x29,0,43,19]
      panes:
        # Gordon's startup steps (register on the bus, load the devops-dev
        # skill, read the spawn mode) live in the "## Startup" section of the
        # system-prompt file below.
        #
        # Slash commands DO chain here: the TUI splits the positional string on
        # each leading `/` and queues one expanded turn per command, in written
        # order. Verified 2026-08-01 with `-- "/ops-triage-agent /ops-pr-review"`,
        # which produced two `>` turns and both command bodies in context. An
        # earlier version of this comment claimed the opposite and steered skill
        # loading into the system prompt; that claim was wrong. Note the same
        # string in headless `-p` mode dispatches ONLY the first command, so never
        # test this behaviour with `-p`.
        #
        # root: ~/loft/ puts this pane on the WORK account
        # (CLAUDE_CONFIG_DIR=$HOME/.claude-work). That does NOT limit the chain:
        # ~/.claude-work/skills and ~/.claude-work/commands are symlinks to
        # ~/.claude, so the whole personal set resolves here too.
        - __claude_with_monitor.sh --system-prompt-file ~/.claude/system-prompts/triage-agent-system-prompt.md -- "/ops-triage-agent"
  - cockpit:
      panes:
        - ~/.claude/scripts/__cockpit_board.sh
