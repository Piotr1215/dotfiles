# /home/decoder/.config/tmuxinator/standup.yml
# PROJECT: standup

name: standup
root: ~/dev/dotfiles/scripts

# Optional tmux socket
# socket_name: foo

# Note that the pre and post options have been deprecated and will be replaced by
# project hooks.

# Project hooks

# Runs on project start, always
# Set NCURSES_NO_UTF8_ACS=1 for better taskwarrior-tui rendering
pre_window: export NCURSES_NO_UTF8_ACS=1

# Run on project start, always - async for better performance
on_project_start: nohup __layouts.sh 8 >/dev/null 2>&1 &

# Run on project start, the first time
# on_project_first_start: command

# Run on project start, after the first time
# on_project_restart: command

# Run on project exit ( detaching from tmux session )
# on_project_exit: command

# Run on project stop
# on_project_stop: command

# Runs in each window and pane before window/pane specific commands. Useful for setting up interpreter versions.
# pre_window: rbenv shell 2.0.0-p247

# Pass command line options to tmux. Useful for specifying a different tmux.conf.
# tmux_options: -f ~/.tmux.mac.conf

# Change the command to call tmux. This can be used by derivatives/wrappers like byobu.
# tmux_command: byobu

# Specifies (by name or index) which window will be selected on project startup. If not set, the first window is used.
startup_window: answers

# Specifies (by index) which pane of the specified window will be selected on project startup. If not set, the first pane is used.
startup_pane: 1

# Controls whether the tmux session should be attached to automatically. Defaults to true.
# attach: false
enable_pane_titles: true
windows:
  - tasks:
      layout: even-horizontal
      panes:
        - |
          <% if Time.now.monday? %>
            <%= "__summarize_timew.py -p pastweek" %>
          <% else %>
            <%= "__summarize_timew.py -p week" %>
          <% end %>

  # One pane, because the bot asks four questions in order and each answer is
  # pasted on its own. Three panes made sense against a form you filled in one
  # pass. `__standup_answers.sh --pick` copies a single block instead.
  #
  # W is the global alias in .zsh_aliases, not an argument: it pipes into a
  # throwaway markdown nvim buffer, which is what makes the blocks navigable and
  # is why a60c78cc bothered making the paragraphs dip-friendly.
  - answers:
      panes:
        - __standup_answers.sh W
