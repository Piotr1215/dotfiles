# shellcheck shell=bash
#
# Toggle definitions for scripts/__toggles.sh. Plain bash, sourced at startup.
#
# Register a toggle with:
#
#   toggle_register "<name>" "<status>" "<on>" "<off>" \
#       ["<description>"] ["<on-label>" "<off-label>"]
#
# The three actions are bash function names or single shell commands. The
# optional description is a short paragraph the preview panel shows, for the
# part the action names cannot say: what the toggle actually controls. The
# optional labels rename the two states for display (speak/base,
# active/disabled); use the toggled thing's own vocabulary, in the
# description too. The model underneath stays binary on/off.
#
#   status  reports the state through its exit code:
#             0 = on, 1 = off, any other code = unreadable, renders "[?? ]"
#   on/off  drive the toggle to that state explicitly. They are never called to
#           blind-flip, so each one may assume it knows the target.
#
# The board reads the state, then runs the opposite state's action. When the
# state cannot be read it refuses to run anything and records why.
#
# A composite action is just a function with several steps. The board runs it
# with errexit on, so it stops at the first failing step and the failure lands
# in the toggle's last-result file.

# --------------------------------------------------------------------------
# margin-default: whether new sessions start with the reading margin.
# Composite: persist the .tmux.conf line first, then flip the live global
# option, which is what the session-created hook actually consults. The grep
# makes a missing line fail the step instead of letting sed match nothing.
# The per-window margin itself is not on the board: it is an action on the
# current window, bound to alt-m in tmux, not a system state.
# --------------------------------------------------------------------------

tmux_conf="${HOME}/dev/dotfiles/.tmux.conf"

# Only meaningful inside tmux, and failing with a usage-style error there
# would read as a bug rather than "not applicable".
margin_require_tmux() {
	if [ -z "${TMUX:-}" ]; then
		echo "margin-default: needs a tmux session, none in this environment" >&2
		return 2
	fi
}

margin_default_status() {
	margin_require_tmux || return 2
	[ "$(tmux show-options -gqv @reading_margin_default)" = on ]
}

margin_default_set() {
	local target="$1"
	margin_require_tmux || return 2
	grep -q '^set -g @reading_margin_default ' "$tmux_conf"
	sed -i "s/^set -g @reading_margin_default .*/set -g @reading_margin_default ${target}/" "$tmux_conf"
	tmux set-option -g @reading_margin_default "$target"
}

margin_default_on() { margin_default_set on; }
margin_default_off() { margin_default_set off; }

toggle_register "margin-default" "margin_default_status" "margin_default_on" "margin_default_off" \
	"Whether new tmux sessions get the reading margin automatically. Flips the live @reading_margin_default option the session-created hook consults, and persists the matching line in .tmux.conf."

# --------------------------------------------------------------------------
# pto-mode: the top-level home/work control, wrapping __pto.sh.
# One flip changes everything: the persistent timeoff= variable in __boot.sh
# (so the mode survives a weekday reboot) plus the runtime switch __pto.sh
# applies (the /tmp/timeoff_mode flag, default browser, LibreWolf profile,
# status bar). State reads the persistent variable, deliberately not the
# flag: on an ordinary weekend the flag is legitimately up while PTO is off.
# __pto.sh blind-flips, so the margin_set-style adapter fires it only when
# the observed state differs from the target.
# --------------------------------------------------------------------------

pto_script="${HOME}/dev/dotfiles/scripts/__pto.sh"
boot_script="${HOME}/dev/dotfiles/scripts/__boot.sh"

pto_status() {
	local value
	value="$(grep -E '^timeoff=' "$boot_script" | cut -d= -f2)"
	case "$value" in
		1) return 0 ;;
		0) return 1 ;;
		*)
			echo "pto-mode: timeoff= line in __boot.sh missing or odd ('${value}')" >&2
			return 2
			;;
	esac
}

pto_set() {
	local target="$1" rc=0
	pto_status >/dev/null 2>&1 || rc=$?
	case "$rc" in
		0) if [ "$target" = on ]; then return 0; fi ;;
		1) if [ "$target" = off ]; then return 0; fi ;;
		*)
			echo "pto-mode: state unreadable, refusing to toggle blindly" >&2
			return 1
			;;
	esac
	"$pto_script"
}

pto_on() { pto_set on; }
pto_off() { pto_set off; }

toggle_register "pto-mode" "pto_status" "pto_on" "pto_off" \
	"Top-level home/work control via __pto.sh. home flips __boot.sh to weekend behavior even on weekdays and applies the runtime switch: /tmp/timeoff_mode flag, default browser (LibreWolf vs Chrome), LibreWolf profile (decoder vs Work), status bar. work returns everything to work mode. State is the persistent timeoff= variable, so a plain weekend reads work while the flag is legitimately up." \
	"home" "work"

# --------------------------------------------------------------------------
# ufp: the runtime home/work switch, mirroring the ufp zsh function (which
# cannot be called from bash, hence the copied steps; __pto.sh carries the
# same lines). Runtime only: __boot.sh stays untouched, pto-mode above is
# the persistent version.
# --------------------------------------------------------------------------

ufp_flag="/tmp/timeoff_mode"
ufp_profiles_ini="${HOME}/.var/app/io.gitlab.librewolf-community/.librewolf/profiles.ini"

ufp_status() { [ -f "$ufp_flag" ]; }

# ufp's BROWSER export is omitted: an environment variable cannot reach
# other shells from here.
ufp_set_librewolf_profile() {
	if [ -f "$ufp_profiles_ini" ]; then
		sed -i.bak '/^\[InstallAA67A15BF0F93AE3\]/,/^$/{s|^Default=.*|Default='"$1"'|}' "$ufp_profiles_ini"
	fi
}

# Cosmetic, so it never fails the composite.
ufp_refresh_status_bar() {
	"${HOME}/dev/dotfiles/scripts/__tmux_active_task.sh" --update 2>/dev/null || true
	tmux refresh-client -S 2>/dev/null || true
}

# The flag is the state the status reads, so it moves last: a failed browser
# or profile step leaves the toggle still reading the old state.
ufp_home() {
	xdg-settings set default-web-browser io.gitlab.librewolf-community.desktop
	ufp_set_librewolf_profile "7fs4462i.decoder"
	touch "$ufp_flag"
	ufp_refresh_status_bar
}

ufp_work() {
	xdg-settings set default-web-browser google-chrome.desktop
	ufp_set_librewolf_profile "j549qbym.Work"
	rm -f "$ufp_flag"
	ufp_refresh_status_bar
}

toggle_register "ufp" "ufp_status" "ufp_home" "ufp_work" \
	"Runtime home/work switch, the ufp function on the board: default browser (LibreWolf vs Chrome), LibreWolf default profile (decoder vs Work), the /tmp/timeoff_mode flag other scripts read, and a status bar refresh. Runtime only: __boot.sh stays untouched, so a weekday reboot returns to work mode. pto-mode is the persistent version." \
	"home" "work"

# --------------------------------------------------------------------------
# nats-watcher: the local systemd unit that spawns Claude task agents from
# the homelab NATS queue.
# --------------------------------------------------------------------------

# systemctl is-active exits 3 for a stopped unit, so map the printed state to
# the board's 0/1/2 convention instead of trusting the exit code.
unit_state() {
	local state
	state="$(systemctl --user is-active "$1" 2>/dev/null || true)"
	case "$state" in
		active|activating|reloading) return 0 ;;
		inactive|deactivating|failed) return 1 ;;
		*)
			echo "$1: unit state unreadable (${state:-no answer from systemd})" >&2
			return 2
			;;
	esac
}

nats_watcher_status() { unit_state nats-watcher.service; }
nats_watcher_on() { systemctl --user start nats-watcher.service; }
nats_watcher_off() { systemctl --user stop nats-watcher.service; }

toggle_register "nats-watcher" "nats_watcher_status" "nats_watcher_on" "nats_watcher_off" \
	"Local systemd unit watching the homelab NATS queue and spawning a Claude agent session per incoming task. Stopped means new tasks pile up in the queue unserved until it starts again." \
	"active" "stopped"

# Ctrl-e drops into isd, the systemd TUI. isd has no PATH binary on this box:
# it lives in uv's cache and only exists through the uvx launcher, which is
# why `command -v isd` finds nothing.
systemd_edit() { "${HOME}/.local/bin/uvx" --python=3.11 isd-tui; }

toggle_edit_action "nats-watcher" "systemd_edit"

# --------------------------------------------------------------------------
# heal-detectors: alert-heal-detector + inject-heal-detector as one switch.
# Both spawn heal agents (Prometheus alerts, context-injection faults).
# --------------------------------------------------------------------------

# The detector services are oneshots their timers fire, so the unit is
# inactive between runs and cannot carry the state. The state lives in the two
# timers plus the pause files each detector checks before spawning: on means
# both timers run and neither pause file exists. Off writes the pause files
# and leaves the timers running, so the detectors keep logging what they would
# have done.
heal_pause_files=("${HOME}/.local/state/alert-heal-paused" "${HOME}/.local/state/inject-heal-paused")
heal_status() {
	local timer rc f off=()
	for timer in alert-heal-detector.timer inject-heal-detector.timer; do
		rc=0
		unit_state "$timer" || rc=$?
		[ "$rc" -ge 2 ] && return 2
		[ "$rc" -eq 1 ] && off+=("$timer stopped")
	done
	for f in "${heal_pause_files[@]}"; do
		[ -e "$f" ] && off+=("${f##*/} present")
	done
	if [ "${#off[@]}" -gt 0 ]; then
		echo "heal-detectors off: ${off[*]}" >&2
		return 1
	fi
	return 0
}

heal_on() {
	systemctl --user start alert-heal-detector.timer inject-heal-detector.timer
	rm -f "${heal_pause_files[@]}"
}

heal_off() {
	touch "${heal_pause_files[@]}"
}

toggle_register "heal-detectors" "heal_status" "heal_on" "heal_off" \
	"Both self-heal watchers as one switch: alert-heal-detector spawns a heal agent per firing Prometheus alert that Luna judges safe to fix unattended, inject-heal-detector one per context-injection fault. Disabled writes the pause files: the timers keep running and log, alerts and injection faults spawn nothing." \
	"active" "disabled"

toggle_edit_action "heal-detectors" "systemd_edit"

# --------------------------------------------------------------------------
# Homelab cronjobs, flipped by suspending them. ArgoCD never sets
# spec.suspend in these manifests, so a live patch is not drift and sticks.
# Cluster unreachable reads as [?? ] and the flip is refused.
# --------------------------------------------------------------------------

homelab_kubectl() {
	timeout 8 kubectl --kubeconfig "${HOME}/dev/homelab/kubeconfig" -n ai-tools "$@"
}

# On means the cronjob runs on schedule, off means suspended.
cronjob_status() {
	local name="$1" out
	if ! out="$(homelab_kubectl get cronjob "$name" -o jsonpath='{.spec.suspend}' 2>&1)"; then
		echo "cronjob $name: ${out:-cluster unreachable}" >&2
		return 2
	fi
	[ "$out" != "true" ]
}

cronjob_resume() { homelab_kubectl patch cronjob "$1" --type merge -p '{"spec":{"suspend":false}}'; }
cronjob_suspend() { homelab_kubectl patch cronjob "$1" --type merge -p '{"spec":{"suspend":true}}'; }

memory_e2e_status() { cronjob_status agent-memory-e2e-healthcheck; }
memory_e2e_on() { cronjob_resume agent-memory-e2e-healthcheck; }
memory_e2e_off() { cronjob_suspend agent-memory-e2e-healthcheck; }

toggle_register "memory-e2e-check" "memory_e2e_status" "memory_e2e_on" "memory_e2e_off" \
	"Homelab canary CronJob exercising the agent-memory API end to end every six hours, alerting via ntfy on failure. Suspended stops the schedule; the job stays defined." \
	"active" "suspended"

r2r_sync_status() { cronjob_status r2r-memory-sync; }
r2r_sync_on() { cronjob_resume r2r-memory-sync; }
r2r_sync_off() { cronjob_suspend r2r-memory-sync; }

toggle_register "r2r-memory-sync" "r2r_sync_status" "r2r_sync_on" "r2r_sync_off" \
	"Homelab CronJob reconciling agent memories into the R2R vector store. Suspended stops the schedule, so R2R drifts from live memory until resumed." \
	"active" "suspended"

# --------------------------------------------------------------------------
# speak-mode: the travel/home graphics switch, base <-> speak.
# --------------------------------------------------------------------------

graphics_script="${HOME}/dev/dotfiles/scripts/__set_graphics_mode.sh"

# The graphics mode is the discriminator: hybrid = speak, nvidia = base.
# integrated/compute mean someone set a mode by hand, so refuse to guess.
# The profile is deliberately ignored: `perf` legitimately overrides it
# without leaving the conceptual mode.
speak_mode_status() {
	local graphics
	if ! graphics="$(system76-power graphics 2>/dev/null)"; then
		echo "speak-mode: system76-power not answering" >&2
		return 2
	fi
	case "$graphics" in
		hybrid) return 0 ;;
		nvidia) return 1 ;;
		*)
			echo "speak-mode: graphics is '${graphics}', neither speak (hybrid) nor base (nvidia)" >&2
			return 2
			;;
	esac
}

# --no-shutdown --yes: the board must never power the box down or block on a
# confirmation prompt. The graphics switch runs under passwordless sudo.
speak_mode_on() { "$graphics_script" speak --no-shutdown --yes; }
speak_mode_off() { "$graphics_script" base --no-shutdown --yes; }

toggle_register "speak-mode" "speak_mode_status" "speak_mode_on" "speak_mode_off" \
	"Travel/home switch, same as the speak and base aliases. speak is hybrid graphics + battery profile, for presenting over HDMI on battery; base is nvidia + balanced, for AC. CAUTION: the graphics change only takes effect at the next boot, and unlike the aliases the board never shuts down or reboots for you." \
	"speak" "base"

# --------------------------------------------------------------------------
# cpu-clocks: the CPU frequency ceiling, capped for thermals or unlocked.
# system76-power's battery profile writes an absolute 2.7GHz ceiling into
# every cpufreq policy, and coming back up to performance does NOT restore
# it: the profile flips turbo and the pstate percentages while the ceiling
# stays behind, so the cores sit pinned at half clock while the tool reports
# Performance. Unlocking therefore takes both steps, and the ceiling is what
# the status reads, being the half the profile lies about.
# --------------------------------------------------------------------------

cpufreq_dir="/sys/devices/system/cpu/cpufreq"

# Reads policy0 only: the cap is one absolute value applied across every
# policy, so a single pair answers it. Plain cat, no tool that might act.
#
# no_turbo is half the test, not decoration. intel_pstate collapses
# cpuinfo_max_freq to the base clock when turbo is off, so under the battery
# profile both files read 2.7GHz and a bare "scaling equals cpuinfo" test
# reports unlocked in precisely the capped state it exists to catch.
cpu_clocks_status() {
	local cur max turbo
	cur="$(cat "${cpufreq_dir}/policy0/scaling_max_freq" 2>/dev/null)"
	max="$(cat "${cpufreq_dir}/policy0/cpuinfo_max_freq" 2>/dev/null)"
	turbo="$(cat /sys/devices/system/cpu/intel_pstate/no_turbo 2>/dev/null)"
	if [ -z "$cur" ] || [ -z "$max" ] || [ -z "$turbo" ]; then
		echo "cpu-clocks: ${cpufreq_dir}/policy0 or intel_pstate unreadable" >&2
		return 2
	fi
	[ "$turbo" = 0 ] && [ "$cur" = "$max" ]
}

# Per policy, because the P-core and E-core clusters have different ceilings
# (5.4, 5.3 and 4.7GHz here) and one shared value would cap the fast cores.
cpu_clocks_write_max() {
	local p max
	for p in "${cpufreq_dir}"/policy*; do
		max="$(cat "${p}/cpuinfo_max_freq")"
		echo "$max" | sudo -n tee "${p}/scaling_max_freq" >/dev/null
	done
}

# Only ever reached with turbo on, where cpuinfo_max_freq is the true
# hardware ceiling rather than the base clock.
cpu_clocks_write_half() {
	local p
	for p in "${cpufreq_dir}"/policy*; do
		echo $(( $(cat "${p}/cpuinfo_max_freq") / 2 )) | sudo -n tee "${p}/scaling_max_freq" >/dev/null
	done
}

# The profile moves first, the ceiling second, and the status call last so a
# half-applied run still reads capped.
cpu_clocks_on() {
	system76-power profile performance >/dev/null
	cpu_clocks_write_max
	cpu_clocks_status
}

# The battery profile normally reapplies its own ceiling; the explicit write
# covers the case where it does not, rather than trusting a side effect.
cpu_clocks_off() {
	local rc=0
	system76-power profile battery >/dev/null
	if cpu_clocks_status >/dev/null 2>&1; then
		cpu_clocks_write_half
	fi
	cpu_clocks_status >/dev/null 2>&1 || rc=$?
	[ "$rc" -eq 1 ]
}

toggle_register "cpu-clocks" "cpu_clocks_status" "cpu_clocks_on" "cpu_clocks_off" \
	"CPU frequency ceiling. unlocked is the performance profile plus every cpufreq policy raised to its own hardware maximum; capped is the battery profile and its 2.7GHz ceiling. Built for EVE multiboxing, where capped runs the package around 70C and unlocked plateaus near 88C against a 105C trip, buying headroom only in the moments that are CPU-bound (the GPU stays welded to its 99W power cap either way). Per session, not persistent: the EVE launch wrapper forces the battery profile on every client launch, and a reboot returns to capped." \
	"unlocked" "capped"

# --------------------------------------------------------------------------
# classif-autounload: whether classif's model leaves the GPU when idle.
# classif reads its Ollama keep-alive from ~/.config/classif/keep_alive on
# every call (an exported CLASSIF_KEEP_ALIVE would override it, so none is
# exported): absent means 30 minutes, -1 means until `classif unload`. The
# file is the state. Each action ends with one tiny classif call so the
# loaded model's expiry changes now rather than at the next real call.
# --------------------------------------------------------------------------

classif_keep_file="${XDG_CONFIG_HOME:-${HOME}/.config}/classif/keep_alive"
classif_bin="${HOME}/.local/bin/classif"

classif_autounload_status() {
	local v
	[ -e "$classif_keep_file" ] || return 0
	v="$(head -n1 "$classif_keep_file" 2>/dev/null)"
	if [ "$v" = "-1" ]; then
		return 1
	fi
	echo "classif-autounload: ${classif_keep_file} holds '${v}', neither absent (auto-unload) nor -1 (hot)" >&2
	return 2
}

classif_autounload_touch() {
	local rc=0
	printf 'ok\n' | "$classif_bin" "is this text" >/dev/null 2>&1 || rc=$?
	if [ "$rc" -gt 1 ]; then
		echo "classif-autounload: classif call failed with exit ${rc}" >&2
		return 1
	fi
}

# Only a loaded model gets touched, so turning auto-unload on never loads one.
classif_autounload_on() {
	rm -f "$classif_keep_file"
	if curl -sf --max-time 2 http://localhost:11434/api/ps | grep -q '"name"'; then
		classif_autounload_touch
	fi
	[ ! -e "$classif_keep_file" ]
}

# Hot loads the model now if it is not loaded, so the next call is warm.
classif_autounload_off() {
	mkdir -p "$(dirname "$classif_keep_file")"
	printf -- '-1\n' >"$classif_keep_file"
	classif_autounload_touch
	[ "$(head -n1 "$classif_keep_file")" = "-1" ]
}

toggle_register "classif-autounload" "classif_autounload_status" "classif_autounload_on" "classif_autounload_off" \
	"How long classif's model (Winnow, 8 GB of VRAM on this GPU) stays loaded after a call. auto-unload frees the GPU after 30 idle minutes, and the next classif call then pays a 3 to 5 s cold load. hot keeps it loaded until classif unload, so every short call stays near 0.2 s. State is ~/.config/classif/keep_alive: absent or -1." \
	"auto-unload" "hot"

# --------------------------------------------------------------------------
# injection-guard: scores web content that tools bring into Claude Code and Codex
# sessions for prompt injection (Horizon guard-small on CPU) and blocks nothing. State is
# one flag file; the guard script owns the model, the hook, and the log.
# --------------------------------------------------------------------------

injection_guard_bin="${HOME}/.claude/scripts/__injection_guard.sh"
injection_guard_flag="${HOME}/.local/state/injection-guard/enabled"

injection_guard_status() { [ -f "$injection_guard_flag" ]; }

# on installs and verifies the model when missing (268 MB), then writes the
# flag last, so a failed download leaves the toggle reading off.
injection_guard_on() { "$injection_guard_bin" on; }
injection_guard_off() { "$injection_guard_bin" off; }

toggle_register "injection-guard" "injection_guard_status" "injection_guard_on" "injection_guard_off" \
	"Scores every WebFetch, WebSearch, crawl4ai, Brave, Perplexity and Chrome page-read result (Codex: its Brave, Perplexity, crawl4ai and Playwright reads; its built-in web search fires no hooks) for prompt injection with a CPU classifier, in the background, and logs p(injection). Nothing is blocked. A result at p>=0.99 reaches the session's model as an automated note naming the page and score, beside its next tool call or prompt; in Claude Code the injection-hits mod also sends it when the session sits idle. Attempts over time: injection-guard report, or injection-guard watch for a live view; injection-guard allow <url-prefix> silences a page you trust. off skips scoring and notes; the model and log stay. Delete the feature: injection-guard purge, then drop this section, the hook and notify entries in ~/.claude/settings.json and ~/.codex/hooks.json, CLAUDE_CODE_PLUGIN_DIRS in settings.json, and ~/.local/bin/injection-guard. Plan: Piotr1215/claude#184."
toggle_info_action "injection-guard" "\"\$injection_guard_bin\" status"

# --------------------------------------------------------------------------
# Agent guards: PreToolUse hooks in ~/.claude/scripts that Claude Code and
# Codex both run (Codex through ~/.codex/hooks/__codex_guard_shim.py). Each
# guard reads its own flag file on every call, so a flip reaches every running
# session on its next command, no restart. The flag marks off: no file means
# guarding, which is also the state after a fresh install.
# --------------------------------------------------------------------------

agent_guards_dir="${XDG_STATE_HOME:-${HOME}/.local/state}/agent-guards"

agent_guard_status() { [ ! -e "${agent_guards_dir}/$1.off" ]; }
agent_guard_on() { rm -f "${agent_guards_dir}/$1.off"; [ ! -e "${agent_guards_dir}/$1.off" ]; }
agent_guard_off() { mkdir -p "$agent_guards_dir"; touch "${agent_guards_dir}/$1.off"; }

toggle_register "rm-gate" "agent_guard_status rm-gate" "agent_guard_on rm-gate" "agent_guard_off rm-gate" \
	"Recursive rm outside /tmp and ~/.cache. Claude Code asks you first; Codex cannot show a prompt, so it refuses outright, and that includes routine cleanup like rm -rf build or node_modules in a repo. A refusal names this toggle. off lets every recursive rm run unchecked in both until switched back. Code: ~/.claude/scripts/__rm_scratch_gate.mjs."

toggle_register "git-gate" "agent_guard_status git-gate" "agent_guard_on git-gate" "agent_guard_off git-gate" \
	"Codex only: refuses git reset --hard, git clean (a dry run passes), a forced push, and checkout or restore of the whole tree (.). Claude Code holds the same commands with ask rules in ~/.claude/settings.json, which this toggle does not touch. A refusal names this toggle. off lets Codex run them unchecked. Code: ~/.claude/scripts/__git_destructive_gate.mjs."

toggle_register "verify-gate" "agent_guard_status verify-gate" "agent_guard_on verify-gate" "agent_guard_off verify-gate" \
	"Claude Code and Codex: refuses a git commit until the repo's checks ran and recorded a pass for that exact tree (the /verify skill). Docs-only and tests-only commits pass. off lets both commit unchecked. Code: ~/.claude/scripts/__verify_gate_hook.sh."

# --------------------------------------------------------------------------
# ingest: every feed that brings events to Kendra and Gordon, or changes the
# task ledger without them, as one switch. State is the pause flag in
# ~/.claude/scripts/__lib_ingest_pause.sh, the file every reader checks: the
# units' ConditionPathExists drop-in, __cron_run.sh, and the health monitor
# and table, so a paused feed stays down across logins and Kendra leaves it be.
# --------------------------------------------------------------------------

ingest_lib="${HOME}/.claude/scripts/__lib_ingest_pause.sh"

ingest_status() {
	[ -r "$ingest_lib" ] || { echo "ingest: ${ingest_lib} missing" >&2; return 2; }
	# shellcheck source=/dev/null
	. "$ingest_lib"
	! ingest_paused
}

# Flag first, so a unit that restarts between the two steps meets its condition.
ingest_on() {
	# shellcheck source=/dev/null
	. "$ingest_lib"
	rm -f "$INGEST_PAUSE_FLAG"
	systemctl --user start "${INGEST_LONG_UNITS[@]}"
}

ingest_off() {
	# shellcheck source=/dev/null
	. "$ingest_lib"
	mkdir -p "$(dirname "$INGEST_PAUSE_FLAG")"
	date -Iseconds >"$INGEST_PAUSE_FLAG"
	systemctl --user stop "${INGEST_UNITS[@]}"
}

# The feed units, then the feed rows of Kendra's health table, read-only.
ingest_info() {
	# shellcheck source=/dev/null
	. "$ingest_lib" || return 0
	local u
	for u in "${INGEST_LONG_UNITS[@]}"; do
		printf '%-22s %s\n' "${u%.service}" "$(systemctl --user is-active "$u" 2>/dev/null || true)"
	done
	"${HOME}/.claude/scripts/__intake_source_health.sh" 2>/dev/null |
		awk -F'|' 'NR > 2 {
			for (i = 2; i <= 4; i++) gsub(/^ +| +$/, "", $i)
			if ($2 ~ /^(ingest$|linear-feed|github-notifications|auto-triage|pr-watch|delivery:)/)
				printf "%-22s %-8s %s\n", $2, $3, $4
		}'
}

toggle_register "ingest" "ingest_status" "ingest_on" "ingest_off" \
