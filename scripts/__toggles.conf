# --------------------------------------------------------------------------
# slack-dms: whether agents get Slack direct and group DM content. Off is a
# privacy pause (Piotr, 11 Nov: "slack dms are off for now so you don't get
# security code"): the feed archives DMs only, ~/.claude's
# __slack_dm_pause_guard.py denies agent Slack reads of DMs and DM files, and
# thread-watch reports who replied with the text held. The shared state file
# is read for every event and call. When it is absent, the existing
# environment setting (defaulting to skipped) remains in force.
# --------------------------------------------------------------------------

slack_dms_state="${XDG_STATE_HOME:-${HOME}/.local/state}/slack-feed/dms"

slack_dms_status() {
	if [ -e "$slack_dms_state" ] || [ -L "$slack_dms_state" ]; then
		if [ ! -r "$slack_dms_state" ]; then
			echo "slack-dms: cannot read $slack_dms_state; treating DMs as off" >&2
			return 1
		fi
		local state
		state="$(cat "$slack_dms_state" 2>/dev/null)" || return 1
		case "$state" in
			on) return 0 ;;
			off) return 1 ;;
			*) echo "slack-dms: invalid state in $slack_dms_state; treating DMs as off" >&2; return 1 ;;
		esac
	fi
	[ "${SLACK_FEED_SKIP_DMS:-1}" = 0 ]
}

slack_dms_set() {
	local target="$1"
	mkdir -p "$(dirname "$slack_dms_state")"
	printf '%s\n' "$target" > "$slack_dms_state"
}

slack_dms_on() { slack_dms_set on; }
slack_dms_off() { slack_dms_set off; }

toggle_register "slack-dms" "slack_dms_status" "slack_dms_on" "slack_dms_off" \
	"Whether agents get your Slack direct and group DMs. On: DM events reach Gordon and Kendra and agents may read DMs. Off pauses DMs for every agent: the feed archives them only, agent Slack reads of DMs, Slack files and unscoped private searches are blocked, and thread watches say who replied but not what. Takes effect at the next event or read; turning it on does not replay what came in while off. Stable agents get the read block from their next start." \
	"on" "off"

# --------------------------------------------------------------------------
# kendra-runtime: which runtime Kendra (the intake agent) runs on.
# __intake_launch.sh asks __intake_runtime.py at every launch; its first token
# of ~/.local/state/intake-runtime (claude, codex or auto) overrides the load
# based choice. Status prefers the live runtime, the @agent_resume_runner
# option __intake_launch.sh sets on her pane, and falls back to the pin when
# she is down. A pin with no pane reads the pin; no pin and no pane is
# unreadable. Composite: write the pin, then __intake_restart.sh (Ctrl-C and
# her own launch line in her own pane), which refuses mid-turn. A refusal
# leaves the pin set and the live runtime unchanged, so the toggle still
# reads the old state.
# --------------------------------------------------------------------------

kendra_pin="${XDG_STATE_HOME:-${HOME}/.local/state}/intake-runtime"
kendra_window="=task:kendra"
kendra_pane_index=1

kendra_live_runtime() {
	local pane
	pane=$(tmux list-panes -t "$kendra_window" -F '#{pane_index} #{pane_id}' 2>/dev/null |
		awk -v i="$kendra_pane_index" '$1 == i {print $2; exit}') || true
	[ -n "$pane" ] || return 0
	tmux show-options -pqv -t "$pane" @agent_resume_runner 2>/dev/null || true
}

kendra_runtime_status() {
	local value
	value=$(kendra_live_runtime)
	if [ -z "$value" ] && [ -r "$kendra_pin" ]; then
		value=$(awk '{print $1; exit}' "$kendra_pin")
	fi
	case "$value" in
		claude) return 0 ;;
		codex) return 1 ;;
		*)
			echo "kendra-runtime: no live runtime on her pane and no claude or codex pin in $kendra_pin" >&2
			return 2
			;;
	esac
}

kendra_runtime_set() {
	mkdir -p "$(dirname "$kendra_pin")"
	printf '%s\n' "$1" > "$kendra_pin"
	"${HOME}/.claude/scripts/__intake_restart.sh"
	# The launcher sets the pane option once its runtime check ends, which can
	# take a Codex probe's worth of time; wait for it before judging.
	for _ in $(seq 1 90); do
		[ "$(kendra_live_runtime)" = "$1" ] && return 0
		sleep 1
	done
	echo "kendra-runtime: restarted, but she is on '$(kendra_live_runtime)', not $1 (fallback or failed launch)" >&2
	return 1
}

kendra_runtime_on() { kendra_runtime_set claude; }
kendra_runtime_off() { kendra_runtime_set codex; }

toggle_register "kendra-runtime" "kendra_runtime_status" "kendra_runtime_on" "kendra_runtime_off" \
	"Which runtime Kendra, the intake agent, runs on. Flipping writes the pin ~/.local/state/intake-runtime (claude or codex) and then restarts her: Ctrl-C to her pane and her own launch line, a fresh session with no resume, so her shift context is lost. The restart is refused while she is mid-turn; the pin stays set and takes effect at her next launch, and the toggle keeps reading the runtime she is on. Codex still falls back to claude if its login, model or AGENTS.md fails. The state shown is her live runtime, or the pin while she is down. Removing the pin file returns her to the load-based choice." \
	"claude" "codex"

# --------------------------------------------------------------------------
# Template: copy, rename, uncomment.
# --------------------------------------------------------------------------
#
# Simple case, a flag file:
#
#   example_flag="${HOME}/.local/state/example.flag"
#   example_status() { [ -f "$example_flag" ]; }
#   example_on() { touch "$example_flag"; }
#   example_off() { rm -f "$example_flag"; }
#   toggle_register "example" "example_status" "example_on" "example_off" \
#   	"One short paragraph saying what this actually controls."
#
# Single commands instead of functions, no wrapper needed:
#
#   toggle_register "example" "test -f /tmp/example" "touch /tmp/example" "rm -f /tmp/example"
#
# Composite: several steps, run in order, stopping at the first failure. Put
# the step that proves success last, so a half-applied run still reads as off.
#
#   service_status() { systemctl --user is-active --quiet example.service; }
#   service_on() {
#   	systemctl --user daemon-reload
#   	systemctl --user enable example.service
#   	systemctl --user start example.service
#   }
#   service_off() {
#   	systemctl --user stop example.service
#   	systemctl --user disable example.service
#   }
#   toggle_register "example-service" "service_status" "service_on" "service_off"
#
# A status that cannot tell on from off should exit with something other than
# 0 or 1 (2 is the convention here) and explain itself on stderr. The board
# renders "[?? ]" and refuses the flip instead of guessing.
#
# Ctrl-e opens this conf unless the toggle registers its own editor, which
# runs in the popup terminal (TUIs work):
#
#   toggle_edit_action "example" "systemctl --user edit --full example.service"
