# shellcheck shell=bash
#
# Toggle definitions for scripts/__toggles.sh. Plain bash, sourced at startup.
#
# Register a toggle with:
#
#   toggle_register "<name>" "<status>" "<on>" "<off>" \
#       ["<description>"] ["<on-label>" "<off-label>"]
#
# The three actions are bash function names or single shell commands. The
# optional description is a short paragraph the preview panel shows, for the
# part the action names cannot say: what the toggle actually controls. The
# optional labels rename the two states for display (speak/base,
# active/disabled); use the toggled thing's own vocabulary, in the
# description too. The model underneath stays binary on/off.
#
#   status  reports the state through its exit code:
#             0 = on, 1 = off, any other code = unreadable, renders "[?? ]"
#   on/off  drive the toggle to that state explicitly. They are never called to
#           blind-flip, so each one may assume it knows the target.
#
# The board reads the state, then runs the opposite state's action. When the
# state cannot be read it refuses to run anything and records why.
#
# A composite action is just a function with several steps. The board runs it
# with errexit on, so it stops at the first failing step and the failure lands
# in the toggle's last-result file.

# --------------------------------------------------------------------------
# margin-default: whether new sessions start with the reading margin.
# Composite: persist the .tmux.conf line first, then flip the live global
# option, which is what the session-created hook actually consults. The grep
# makes a missing line fail the step instead of letting sed match nothing.
# The per-window margin itself is not on the board: it is an action on the
# current window, bound to alt-m in tmux, not a system state.
# --------------------------------------------------------------------------

tmux_conf="${HOME}/dev/dotfiles/.tmux.conf"

# Only meaningful inside tmux, and failing with a usage-style error there
# would read as a bug rather than "not applicable".
margin_require_tmux() {
	if [ -z "${TMUX:-}" ]; then
		echo "margin-default: needs a tmux session, none in this environment" >&2
		return 2
	fi
}

margin_default_status() {
	margin_require_tmux || return 2
	[ "$(tmux show-options -gqv @reading_margin_default)" = on ]
}

margin_default_set() {
	local target="$1"
	margin_require_tmux || return 2
	grep -q '^set -g @reading_margin_default ' "$tmux_conf"
	sed -i "s/^set -g @reading_margin_default .*/set -g @reading_margin_default ${target}/" "$tmux_conf"
	tmux set-option -g @reading_margin_default "$target"
}

margin_default_on() { margin_default_set on; }
margin_default_off() { margin_default_set off; }

toggle_register "margin-default" "margin_default_status" "margin_default_on" "margin_default_off" \
	"Whether new tmux sessions get the reading margin automatically. Flips the live @reading_margin_default option the session-created hook consults, and persists the matching line in .tmux.conf."

# --------------------------------------------------------------------------
# pto-mode: the top-level home/work control, wrapping __pto.sh.
# One flip changes everything: the persistent timeoff= variable in __boot.sh
# (so the mode survives a weekday reboot) plus the runtime switch __pto.sh
# applies (the /tmp/timeoff_mode flag, default browser, LibreWolf profile,
# status bar). State reads the persistent variable, deliberately not the
# flag: on an ordinary weekend the flag is legitimately up while PTO is off.
# __pto.sh blind-flips, so the margin_set-style adapter fires it only when
# the observed state differs from the target.
# --------------------------------------------------------------------------

pto_script="${HOME}/dev/dotfiles/scripts/__pto.sh"
boot_script="${HOME}/dev/dotfiles/scripts/__boot.sh"

pto_status() {
	local value
	value="$(grep -E '^timeoff=' "$boot_script" | cut -d= -f2)"
	case "$value" in
		1) return 0 ;;
		0) return 1 ;;
		*)
			echo "pto-mode: timeoff= line in __boot.sh missing or odd ('${value}')" >&2
			return 2
			;;
	esac
}

pto_set() {
	local target="$1" rc=0
	pto_status >/dev/null 2>&1 || rc=$?
	case "$rc" in
		0) if [ "$target" = on ]; then return 0; fi ;;
		1) if [ "$target" = off ]; then return 0; fi ;;
		*)
			echo "pto-mode: state unreadable, refusing to toggle blindly" >&2
			return 1
			;;
	esac
	"$pto_script"
}

pto_on() { pto_set on; }
pto_off() { pto_set off; }

toggle_register "pto-mode" "pto_status" "pto_on" "pto_off" \
	"Top-level home/work control via __pto.sh. home flips __boot.sh to weekend behavior even on weekdays and applies the runtime switch: /tmp/timeoff_mode flag, default browser (LibreWolf vs Chrome), LibreWolf profile (decoder vs Work), status bar. work returns everything to work mode. State is the persistent timeoff= variable, so a plain weekend reads work while the flag is legitimately up." \
	"home" "work"

# --------------------------------------------------------------------------
# nats-watcher: the local systemd unit that spawns Claude task agents from
# the homelab NATS queue.
# --------------------------------------------------------------------------

# systemctl is-active exits 3 for a stopped unit, so map the printed state to
# the board's 0/1/2 convention instead of trusting the exit code.
unit_state() {
	local state
	state="$(systemctl --user is-active "$1" 2>/dev/null || true)"
	case "$state" in
		active|activating|reloading) return 0 ;;
		inactive|deactivating|failed) return 1 ;;
		*)
			echo "$1: unit state unreadable (${state:-no answer from systemd})" >&2
			return 2
			;;
	esac
}

nats_watcher_status() { unit_state nats-watcher.service; }
nats_watcher_on() { systemctl --user start nats-watcher.service; }
nats_watcher_off() { systemctl --user stop nats-watcher.service; }

toggle_register "nats-watcher" "nats_watcher_status" "nats_watcher_on" "nats_watcher_off" \
	"Local systemd unit watching the homelab NATS queue and spawning a Claude agent session per incoming task. Stopped means new tasks pile up in the queue unserved until it starts again." \
	"active" "stopped"

# Ctrl-e drops into isd, the systemd TUI. isd has no PATH binary on this box:
# it lives in uv's cache and only exists through the uvx launcher, which is
# why `command -v isd` finds nothing.
systemd_edit() { "${HOME}/.local/bin/uvx" --python=3.11 isd-tui; }

toggle_edit_action "nats-watcher" "systemd_edit"

# --------------------------------------------------------------------------
# heal-detectors: alert-heal-detector + inject-heal-detector as one switch.
# Both spawn heal agents (Prometheus alerts, context-injection faults).
# --------------------------------------------------------------------------

# On means both units run, off means neither. A mixed state is not a binary
# state, so it reads as unreadable and the board refuses to flip it.
heal_status() {
	local a=0 b=0
	unit_state alert-heal-detector.service || a=$?
	unit_state inject-heal-detector.service || b=$?
	if [ "$a" -ge 2 ] || [ "$b" -ge 2 ]; then
		return 2
	fi
	if [ "$a" -ne "$b" ]; then
		echo "heal-detectors: mixed state, one unit up and one down, fix by hand" >&2
		return 2
	fi
	return "$a"
}

heal_on() {
	systemctl --user start alert-heal-detector.service
	systemctl --user start inject-heal-detector.service
}

heal_off() {
	systemctl --user stop alert-heal-detector.service
	systemctl --user stop inject-heal-detector.service
}

toggle_register "heal-detectors" "heal_status" "heal_on" "heal_off" \
	"Both self-heal watchers as one switch: alert-heal-detector spawns a heal agent per firing Prometheus alert, inject-heal-detector one per context-injection fault. Disabled means alerts and injection faults spawn nothing." \
	"active" "disabled"

toggle_edit_action "heal-detectors" "systemd_edit"

# --------------------------------------------------------------------------
# Homelab cronjobs, flipped by suspending them. ArgoCD never sets
# spec.suspend in these manifests, so a live patch is not drift and sticks.
# Cluster unreachable reads as [?? ] and the flip is refused.
# --------------------------------------------------------------------------

homelab_kubectl() {
	timeout 8 kubectl --kubeconfig "${HOME}/dev/homelab/kubeconfig" -n ai-tools "$@"
}

# On means the cronjob runs on schedule, off means suspended.
cronjob_status() {
	local name="$1" out
	if ! out="$(homelab_kubectl get cronjob "$name" -o jsonpath='{.spec.suspend}' 2>&1)"; then
		echo "cronjob $name: ${out:-cluster unreachable}" >&2
		return 2
	fi
	[ "$out" != "true" ]
}

cronjob_resume() { homelab_kubectl patch cronjob "$1" --type merge -p '{"spec":{"suspend":false}}'; }
cronjob_suspend() { homelab_kubectl patch cronjob "$1" --type merge -p '{"spec":{"suspend":true}}'; }

memory_e2e_status() { cronjob_status agent-memory-e2e-healthcheck; }
memory_e2e_on() { cronjob_resume agent-memory-e2e-healthcheck; }
memory_e2e_off() { cronjob_suspend agent-memory-e2e-healthcheck; }

toggle_register "memory-e2e-check" "memory_e2e_status" "memory_e2e_on" "memory_e2e_off" \
	"Homelab canary CronJob exercising the agent-memory API end to end every six hours, alerting via ntfy on failure. Suspended stops the schedule; the job stays defined." \
	"active" "suspended"

r2r_sync_status() { cronjob_status r2r-memory-sync; }
r2r_sync_on() { cronjob_resume r2r-memory-sync; }
r2r_sync_off() { cronjob_suspend r2r-memory-sync; }

toggle_register "r2r-memory-sync" "r2r_sync_status" "r2r_sync_on" "r2r_sync_off" \
	"Homelab CronJob reconciling agent memories into the R2R vector store. Suspended stops the schedule, so R2R drifts from live memory until resumed." \
	"active" "suspended"

# --------------------------------------------------------------------------
# speak-mode: the travel/home graphics switch, base <-> speak.
# --------------------------------------------------------------------------

graphics_script="${HOME}/dev/dotfiles/scripts/__set_graphics_mode.sh"

# The graphics mode is the discriminator: hybrid = speak, nvidia = base.
# integrated/compute mean someone set a mode by hand, so refuse to guess.
# The profile is deliberately ignored: `perf` legitimately overrides it
# without leaving the conceptual mode.
speak_mode_status() {
	local graphics
	if ! graphics="$(system76-power graphics 2>/dev/null)"; then
		echo "speak-mode: system76-power not answering" >&2
		return 2
	fi
	case "$graphics" in
		hybrid) return 0 ;;
		nvidia) return 1 ;;
		*)
			echo "speak-mode: graphics is '${graphics}', neither speak (hybrid) nor base (nvidia)" >&2
			return 2
			;;
	esac
}

# --no-reboot --yes: the board must never reboot the box or block on a
# confirmation prompt. The graphics switch runs under passwordless sudo.
speak_mode_on() { "$graphics_script" speak --no-reboot --yes; }
speak_mode_off() { "$graphics_script" base --no-reboot --yes; }

toggle_register "speak-mode" "speak_mode_status" "speak_mode_on" "speak_mode_off" \
	"Travel/home switch, same as the speak and base aliases. speak is hybrid graphics + battery profile, for presenting over HDMI on battery; base is nvidia + balanced, for AC. CAUTION: the graphics change only takes effect after a reboot, and the board never reboots for you." \
	"speak" "base"

# --------------------------------------------------------------------------
# Template: copy, rename, uncomment.
# --------------------------------------------------------------------------
#
# Simple case, a flag file:
#
#   example_flag="${HOME}/.local/state/example.flag"
#   example_status() { [ -f "$example_flag" ]; }
#   example_on() { touch "$example_flag"; }
#   example_off() { rm -f "$example_flag"; }
#   toggle_register "example" "example_status" "example_on" "example_off" \
#   	"One short paragraph saying what this actually controls."
#
# Single commands instead of functions, no wrapper needed:
#
#   toggle_register "example" "test -f /tmp/example" "touch /tmp/example" "rm -f /tmp/example"
#
# Composite: several steps, run in order, stopping at the first failure. Put
# the step that proves success last, so a half-applied run still reads as off.
#
#   service_status() { systemctl --user is-active --quiet example.service; }
#   service_on() {
#   	systemctl --user daemon-reload
#   	systemctl --user enable example.service
#   	systemctl --user start example.service
#   }
#   service_off() {
#   	systemctl --user stop example.service
#   	systemctl --user disable example.service
#   }
#   toggle_register "example-service" "service_status" "service_on" "service_off"
#
# A status that cannot tell on from off should exit with something other than
# 0 or 1 (2 is the convention here) and explain itself on stderr. The board
# renders "[?? ]" and refuses the flip instead of guessing.
#
# Ctrl-e opens this conf unless the toggle registers its own editor, which
# runs in the popup terminal (TUIs work):
#
#   toggle_edit_action "example" "systemctl --user edit --full example.service"
