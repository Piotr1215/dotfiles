# Link picker settings, read by __link_candidates.py.
#
# The picker is launched from a global hotkey through AutoKey, which carries
# PATH and nothing else from the shell, so an exported LINK_* variable never
# reaches it. This file is the knob that does. Environment variables of the
# same name still win, for one-off runs from a terminal.
#
# Full-line comments only, values run to the end of the line.

# How many browser history rows to keep, newest first (LINK_HISTORY_LIMIT).
limit = 500

# Cap per host within each profile, so a day of github review cannot take
# every slot and push notion or linear out (LINK_HISTORY_PER_HOST).
per_host = 30

# Set to off to drop history and show only the curated pet snippets
# (LINK_HISTORY=0).
history = on

# Browser profiles as <tag>:<path to the history database>. The tag is shown
# on every row it produces, so typing #work narrows to work history and #home
# to personal. Drop a line to drop that profile from the picker entirely.
#
# The labels below come from what each profile actually holds, not from its
# name: loft github, linear, notion and spacelift on one side, youtube,
# zkillboard and amazon on the other.
profile = work:~/.var/app/io.gitlab.librewolf-community/.librewolf/j549qbym.Work/places.sqlite
profile = work:~/.config/google-chrome/Profile 1/History
profile = home:~/.var/app/io.gitlab.librewolf-community/.librewolf/7fs4462i.decoder/places.sqlite
profile = home:~/.config/google-chrome/Default/History
