# .github/workflows/test_workflow.yml
name: Run Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test-type: [shell, bats, python]
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y tmux zsh neovim ripgrep fzf age taskwarrior \
          python3-gi gir1.2-gtk-3.0 xvfb python3-pytest python3-requests
        sudo npm install -g bats
        # Create minimal .taskrc to avoid interactive prompts
        echo 'data.location=~/task' > ~/.taskrc
        mkdir -p ~/task
        # Scripts and tests expect the repo at ~/dev/dotfiles
        mkdir -p ~/dev
        ln -sfn "$GITHUB_WORKSPACE" ~/dev/dotfiles

    - name: Run Tests
      env:
        SUITE: ${{ matrix.test-type }}
      # Every test file runs except those in tests/ci_skip.txt
      run: tests/run_ci.sh "$SUITE"
